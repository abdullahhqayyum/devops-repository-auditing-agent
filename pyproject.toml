[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-audit-agent"
version = "1.0.0"
description = "LLM-driven agent that audits GitHub repositories for DevOps best-practice violations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40,<4",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "ruff>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["agent", "tools"]
packages = ["auditor"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["eval/demo_repo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = ["SIM108", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
